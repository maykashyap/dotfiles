# Monitor
monitorv2 {
 output = HDMI-A-1
 mode = 2560x1440@144
 position = 0x0
 scale = 1
 bitdepth = 10
 cm = hdr
 sdrbrightness = 1.5
 sdrsaturation = 0.98
 vrr = 1
}
workspace = 1, monitor:HDMI-A-1
monitor=eDP-2, 1920x1080@144, -1920x0, 1

bindl = ,switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = ,switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@144, -1920x0, 1"

# variables
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun --show-icons

# Autostart
exec-once = nm-applet --indicator
exec-once = rog-control-center
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wluma
exec-once = hyprctl setcursor Marathon-regular 15
exec-once = XDG_MENU_PREFIX=plasma- kbuildsycoca6

exec = dunst
exec = hyprpaper
exec = ~/.config/scripts/hypr/waybar.sh --init

# exec-once = steam -silent

# Environment Variables
env = XCURSOR_THEME,Marathon-regular
env = HYPRCURSOR_SIZE,0
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# use qt5ct instead of kde if latter is not installed
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_MENU_PREFIX,plasma-
env = TERMINAL,kitty

debug {
  disable_logs = false
}

# Settings
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 0
    col.active_border = 0xff7aa3f7
    col.inactive_border = 0xffa9b1d6
    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 10
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        xray = false
        ignore_opacity=true
        brightness = 0.8
        contrast = 0.9
        vibrancy = 0.6
        vibrancy_darkness = 0.0
    }
}

animations {
    enabled = yes 

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}
layerrule {
    name = fix-rofi
    match:namespace = rofi
    no_anim = true
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

input {
    kb_layout = us,de
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
        drag_lock = 1
    }
}

gesture = 3, horizontal, workspace

cursor {
  no_hardware_cursors = true
  inactive_timeout = 3
  default_monitor = "DP-2"
}

# Tokyo Night Colors converted to RGBA
$col_focused = 0xff111111
$col_unfocused = 0xff333333
$col_urgent = 0xfff7768e
$text_color = 0xffc0caf5

group {
    groupbar {
        # Text color on the tabs
        text_color = $text_color
        
        # Background colors for the tabs
        col.active = $col_focused
        col.inactive = $col_unfocused
        
        # Font settings
        font_size = 13
        font_family = JetBrainsMono Nerd Font
        font_weight_active = semibold
        font_weight_inactive = normal
        indicator_height = 0
        rounding = 4
        round_only_edges = false
        gaps_in = 2
        gaps_out = 3
        gradients = true
        gradient_rounding = 4
        gradient_round_only_edges = false
        render_titles = true # Uncomment if you want titles in the bar
        height = 20
        keep_upper_gap = false
    }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

windowrule = match:class Lxappearance, float on
windowrule = match:class feh, float on
windowrule = match:class Blueman-manager, float on
windowrule = match:class pavucontrol, float on
windowrule = match:class qimgv, float on

# Source
source = ~/.config/hypr/keybinds.conf
