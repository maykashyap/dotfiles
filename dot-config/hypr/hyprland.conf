###############
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#monitor=DP-2, 2560x1440@143.97, 0x0, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1.25, sdrsaturation, 0.98
monitorv2 {
 output = DP-1-2
 mode = 2560x1440@143.97
 position = 0x0
 scale = 1
 bitdepth = 10
 cm = hdr
 sdrbrightness = 1.25
 sdrsaturation = 0.98
}
workspace = 1, monitor:DP-1-2
monitor=DP-2, 1920x1080@144, 2560x360, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun --show-icons

# Tokyo Night Colors converted to RGBA
$col_focused = 0xff292e42
$col_unfocused = 0xff16161d
$col_urgent = 0xfff7768e
$text_color = 0xffc0caf5


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = swaybg -c '#111111'
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wluma
exec-once = hyprctl setcursor Dracula-cursors 15

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

