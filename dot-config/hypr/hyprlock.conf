source = ~/.cache/wal/colors-hyprland.conf
source = ~/.config/hypr/background.conf

# BACKGROUND
background {
    monitor = DP-1
    #path = screenshot
    path = ~/Pictures/Backgrounds/2026_Marathon_Thief_Vignette_Press_Kit_COMPRESSED_04.png
    #color = $background
    blur_passes = 0
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor = DP-1
    size = 250, 60
    outline_thickness = 2
    dots_text_format = ◆
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.1# Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(26, 27, 38, 100)
    inner_color = rgba(192, 202, 245, 90)
    font_color = rgba(26, 27 , 38, 100)
    fade_on_empty = true
    blur_passes = 2
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = 
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# DATE
label {
  monitor = DP-1
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = DP-1
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}
